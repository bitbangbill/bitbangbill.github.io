<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Seamless tile: traces leaving one edge re-enter at the same point on the opposite edge.
       Used as a CSS mask, so only the alpha matters; colour comes from the stylesheet. -->
  <g fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- top trace: enters left at y40, ends at vias -->
    <path d="M0 40H120L150 70H210"/>
    <path d="M320 40H280"/>
    <!-- vertical trace: enters top at x240, exits bottom at x240 -->
    <path d="M240 0V100L210 130V220L240 250V320"/>
    <!-- 3-bit bus -->
    <path d="M20 100H50L80 130H170"/>
    <path d="M20 114H44L74 144H160"/>
    <path d="M20 128H38L68 158H150"/>
    <!-- lower trace: enters left at y210, exits right at y210 -->
    <path d="M0 210H50L80 180H170"/>
    <path d="M320 210H270"/>
    <!-- short stubs crossing top/bottom edge at x80 -->
    <path d="M80 0V14"/>
    <path d="M80 320V290L110 260H160"/>

    <!-- vias -->
    <circle cx="216" cy="70" r="5"/>
    <circle cx="274" cy="40" r="5"/>
    <circle cx="176" cy="130" r="5"/>
    <circle cx="166" cy="144" r="5"/>
    <circle cx="156" cy="158" r="5"/>
    <circle cx="176" cy="180" r="5"/>
    <circle cx="264" cy="210" r="5"/>
    <circle cx="80" cy="20" r="5"/>
    <circle cx="166" cy="260" r="5"/>

    <!-- IC footprint -->
    <rect x="266" y="266" width="34" height="34" rx="2"/>
  </g>
  <g fill="#000">
    <!-- bus pads -->
    <rect x="12" y="96" width="8" height="8" rx="1"/>
    <rect x="12" y="110" width="8" height="8" rx="1"/>
    <rect x="12" y="124" width="8" height="8" rx="1"/>
    <!-- IC pads -->
    <rect x="272" y="258" width="4" height="6"/>
    <rect x="281" y="258" width="4" height="6"/>
    <rect x="290" y="258" width="4" height="6"/>
    <rect x="272" y="302" width="4" height="6"/>
    <rect x="281" y="302" width="4" height="6"/>
    <rect x="290" y="302" width="4" height="6"/>
    <rect x="302" y="272" width="6" height="4"/>
    <rect x="302" y="281" width="6" height="4"/>
    <rect x="302" y="290" width="6" height="4"/>
  </g>
</svg>
