# Jekyll config. CI builds the site: see .github/workflows/pages.yml.

author: William Tomlinson
email: contact@bitbangbill.dev
email_alt: wrjtomlinson@gmail.com

# Each file in _projects/ becomes a page at /projects/<file-name>.html and a
# card on /portfolio/. Projects with `featured: true` are shown on the home page.
collections:
  projects:
    output: true
    permalink: /projects/:name.html

# No auto-generated excerpts: pages use `summary`, and fetched projects wrap
# their body in {% raw %}, which Jekyll's excerpt splitter warns about.
excerpt_separator: ""

defaults:
  - scope: { type: projects }
    values: { layout: project }

exclude:
  - README.md
  - scripts
  - templates
